<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{--ink:#14181c;--ink2:#4a5763;--line:#ccd4da;--soft:#e6ebef;--paper:#fff;--field:#eff3f6;

  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--field);color:var(--ink);font-size:16px;line-height:1.45;
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-tap-highlight-color:transparent}
  .wrap{max-width:1080px;margin:0 auto;padding:0 12px calc(96px + env(safe-area-inset-bottom))}
  h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
  .muted{color:var(--ink2)} .right{margin-left:auto} .n{font-variant-numeric:tabular-nums}

  header{background:var(--steel);color:#fff;position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top)}
  .bar{max-width:1080px;margin:0 auto;padding:9px 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .mark b{font-size:16px} .mark span{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8fa0ae}
  nav{display:flex;gap:2px;margin-left:auto;background:#111a21;border-radius:9px;padding:3px}
  nav button{appearance:none;border:0;background:transparent;color:#a9b8c4;font:inherit;font-size:14px;
    font-weight:600;padding:8px 13px;border-radius:7px;cursor:pointer;min-height:40px}
  nav button[aria-current="true"]{background:var(--hivis);color:#fff}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:11px;margin-top:13px;overflow:hidden}
  .card>.head{display:flex;align-items:center;gap:10px;padding:11px var(--pad);border-bottom:1px solid var(--soft);background:#fbfcfd}
  .card>.head h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase}
  .card>.body{padding:var(--pad)}
  .grid{display:grid;gap:12px} .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  @media(max-width:700px){.g2,.g3{grid-template-columns:1fr}}

  input:focus,select:focus,textarea:focus{outline:2px solid var(--steel);outline-offset:-1px}

    border:1px solid var(--steel);background:var(--steel);color:#fff;min-height:46px}
  .btn.ghost{background:var(--paper);color:var(--ink);border-color:var(--line)}
  .btn.go{background:var(--hivis);border-color:#1a7fb0;color:#fff}
  .btn.danger{background:var(--paper);border-color:#e0bcae;color:var(--alert)}
  .mini{appearance:none;border:1px solid var(--line);background:var(--paper);border-radius:7px;
    font:inherit;font-size:13px;padding:7px 11px;cursor:pointer;color:var(--ink2);min-height:38px}
  .mini.x{border-color:#e0bcae;color:var(--alert);padding:7px 10px}

  .who b{font-size:11px;color:#8a97a3;font-variant-numeric:tabular-nums;min-width:22px}
  .who span{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who .bor{font-size:9px;letter-spacing:.08em;background:var(--field);border:1px solid var(--soft);

  .rowline input{width:100px;flex:0 0 auto}
  .rowline .u{width:44px;flex:0 0 auto;font-size:13px;color:var(--ink2);text-align:center}

  .warn{background:#fff8e8;border:1px solid #ecd9a4;border-radius:9px;padding:11px var(--pad);font-size:14px;margin-top:13px}

const MEM = {};

async function load(k, d){
  if(HAS_LS){ try{ const v = localStorage.getItem(k); if(v != null) return JSON.parse(v); }catch(e){} }
  if(HAS_WS){ try{ const r = await window.storage.get(k, false); if(r && r.value) return JSON.parse(r.value); }catch(e){} }
  return (k in MEM) ? MEM[k] : d;
}
async function put(k, v){
  const s = JSON.stringify(v);
  MEM[k] = v;
  let ok = false;
  if(HAS_LS){ try{ localStorage.setItem(k, s); ok = true; }catch(e){} }
  if(HAS_WS){ try{ await window.storage.set(k, s, false); ok = true; }catch(e){} }
  return ok || !HAS_LS && !HAS_WS;   // memory-only still counts as saved for the session

    if(!confirm('Clear this form? Anything not submitted is lost.')) return;
    DRAFT = blankSheet(); await put(K.draft, DRAFT); render();
  });
  $('#dlg-x').addEventListener('click', ()=>$('#dlg').close());
  if(!DRAFT) DRAFT = blankSheet();
  render(); syncConfig(); flushQueue();
})();

function render(){
  if(!ME){ $('#hdr').hidden=true; $('#savebar').hidden=true; return signIn(); }
  $('#hdr').hidden=false;
  $('#hdr-sub').textContent = crewOf(ME.id).name;
  const tabs=[['entry','Daily sheet'],['dash','Dashboard']];
  if(isOffice()) tabs.push(['setup','Setup']);
  tabs.push(['refresh','Refresh']);tabs.push(['out','Sign out']);
  $('#nav').innerHTML = tabs.map(([k,l])=>`<button data-tab="${k}" aria-current="${k===TAB}">${l}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.addEventListener('click', async ()=>{
    if(b.dataset.tab==='out'){ ME=null; await put(K.me,null); TAB='entry'; return render(); }
    TAB=b.dataset.tab; window.scrollTo(0,0); render();
  }));
  $('#savebar').hidden = TAB!=='entry';
  if(TAB==='entry') entry(); else if(TAB==='dash') dash(); else setup();
}
function status(m,c){ const e=$('#status'); e.textContent=m; e.className='status '+(c||''); }

function signIn(){

function tie(sel,f){ const el=$(sel); if(el) el.addEventListener('input',()=>{ DRAFT[f]=el.value; queue(); }); }
let t=null;
function queue(){ clearTimeout(t); t=setTimeout(async()=>{
  const ok=await put(K.draft,DRAFT);
  status(ok?'Draft saved on this device':'Draft not saved — submit before closing', ok?'':'bad'); },500); }

function recalc(){
  const codes=DRAFT.codes; let grand=0, men=0;
  document.querySelectorAll('tr[data-emp]').forEach(tr=>{
    const row=DRAFT.hours[tr.dataset.emp]||{};
    const tt=r2(codes.reduce((a,c)=>a+num(row[c]),0));
    const cell=tr.querySelector('[data-rt]'); if(cell) cell.textContent=tt||'';
    tr.classList.toggle('zero',!tt); grand+=tt; if(tt) men++;
  });
  codes.forEach(c=>{ const el=document.querySelector(`[data-ct="${CSS.escape(c)}"]`);
    if(el) el.textContent = r2(Object.values(DRAFT.hours).reduce((a,r)=>a+num(r[c]),0))||'0'; });
  const g=document.querySelector('[data-grand]'); if(g) g.textContent=r2(grand);
  if($('#t-lab')) $('#t-lab').textContent=r2(grand);
  if($('#t-men')) $('#t-men').textContent=men;
  if($('#t-eq'))  $('#t-eq').textContent=equipHours(DRAFT);
}

/* ==========================================================================
   Submit + Google Sheet
   ========================================================================== */
function flatten(s){
  const j=job(s.jobNo), out=[];
  for(const [en,row] of Object.entries(s.hours||{}))
    for(const [c,v] of Object.entries(row)) if(num(v)){
      const i=codeInfo(c);
      out.push({date:s.date, jobNo:s.jobNo, jobName:j.name, foreman:s.foreman, empNo:en,
        empName:emp(en).name, costCode:c, codeDesc:i.desc, hours:num(v)});
    }
  return out;
}
async function send(s){
  if(!EP) return false;
  try{ await fetch(EP,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'sheet', sheet:s, hourRows:flatten(s)})}); return true; }
  catch(e){ return false; }
}
async function flushQueue(){
  if(!EP||!QUEUE.length) return;
  const left=[]; for(const s of QUEUE){ if(!(await send(s))) left.push(s); }
  QUEUE=left; await put(K.queue,QUEUE);
  if(TAB==='entry') status(QUEUE.length?`${QUEUE.length} still waiting to send`:'All sheets sent', QUEUE.length?'':'ok');
}
async function syncConfig(){
  if(!EP) return;
  try{
    const r = await fetch(EP+'?action=config');
    const d = await r.json();
    if(!d || !d.ok || !d.config) return;
    const c = d.config;
    if(!c.jobs || !c.employees) return;
    c.pin = CFG.pin; c.crews = c.crews && c.crews.length ? c.crews : CFG.crews;
    CFG = c; await put(K.cfg, CFG);
    if(TAB==='setup') setup();
  }catch(e){ /* offline — keep the cached copy */ }
}

async function submit(){
  const s=DRAFT;
  if(!s.jobNo||!s.date) return status('Pick a job and a date first','bad');
  if(!s.codes.length)   return status('Pick at least one cost code','bad');
  if(sheetHours(s)===0 && !confirm('No hours entered. Submit anyway?')) return;
  if(SHEETS.some(x=>x.jobNo===s.jobNo&&x.date===s.date&&x.foreman===s.foreman)
     && !confirm(`You already submitted a sheet for job ${s.jobNo} on ${fmtDate(s.date)}. Submit another?`)) return;

  s.id='S'+Date.now().toString(36); s.submittedAt=new Date().toISOString();
  const copy=structuredClone(s);
  SHEETS.push(copy); SHEETS.sort((a,b)=>b.date.localeCompare(a.date));
  if(!(await put(K.sheets,SHEETS))){ SHEETS=SHEETS.filter(x=>x.id!==s.id);
    return status('Could not save on this device — check Settings > Safari > Block All Cookies is off.','bad'); }
  let sent=false;
  if(EP){ sent=await send(copy); if(!sent){ QUEUE.push(copy); await put(K.queue,QUEUE); } }
  DRAFT=blankSheet(); DRAFT.jobNo=copy.jobNo; await put(K.draft,DRAFT);
  status(EP ? (sent?`Sent to the Google Sheet — ${sheetHours(copy)} hours`:'Saved. Will send when you have signal.')
            : `Submitted — ${sheetHours(copy)} hours`, sent||!EP?'ok':'');
  entry();
}

const _wd=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};const _ws=()=>{const d=new Date();d.setDate(d.getDate()-d.getDay());return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};let F={jobNo:'',from:_ws(),to:_wd(),crew:''};

    <div class="body grid g3" style="border-bottom:1px solid var(--soft)">
      <label class="f"><span class="lbl">Job</span><select id="d-job"><option value="">All jobs</option>
        ${CFG.jobs.map(j=>`<option value="${esc(j.no)}" ${F.jobNo===j.no?'selected':''}>${esc(j.no)} — ${esc(j.name)}</option>`).join('')}</select></label>
      <label class="f"><span class="lbl">From</span><input type="date" id="d-f" value="${esc(F.from)}"></label>
      <label class="f"><span class="lbl">To</span><input type="date" id="d-t" value="${esc(F.to)}"></label>
    </div>
    ${rows.length?`<table class="list"><thead><tr><th>Date</th><th>Job</th><th>Crew</th>
      <th class="n">Men</th><th class="n">Hours</th></tr></thead><tbody>
      ${rows.map(s=>{const m=Object.values(s.hours||{}).filter(r=>Object.values(r).some(v=>num(v))).length;
      return `<tr class="click" data-open="${s.id}"><td class="n"><b>${esc(fmtDate(s.date))}</b></td>
        <td>${esc(s.jobNo)} — ${esc(job(s.jobNo).name)}</td><td>${esc(s.foreman)}</td>
        <td class="n">${m}</td><td class="n"><b>${sheetHours(s)}</b></td></tr>`;}).join('')}
      </tbody></table>`:`<div class="empty"><b>No sheets match</b>Widen the filters, or submit a sheet.</div>`}
  </section>

  <div class="tally">
    <div><div class="k">Sheets</div><div class="n">${rows.length}</div></div>
    <div class="hi"><div class="k">Labor hours</div><div class="n">${lab}</div></div>
    <div><div class="k">Equipment hours</div><div class="n">${eq}</div></div>
  </div>

  <div class="grid g2">
    <section class="card"><div class="head"><h2>Hours by cost code</h2></div>
      ${Object.keys(byCode).length?`<table class="list"><tbody>${Object.entries(byCode).sort((a,b)=>b[1].h-a[1].h)
        .map(([c,v])=>`<tr><td class="n" style="width:70px"><b>${esc(c)}</b></td><td>${esc(v.desc)}</td>
        <td class="n" style="text-align:right"><b>${v.h}</b></td></tr>`).join('')}</tbody></table>`

      ${Object.keys(byQty).length?`<table class="list"><tbody>${Object.entries(byQty)
        .map(([c,v])=>`<tr><td class="n" style="width:70px"><b>${esc(c)}</b></td><td>${esc(v.desc)}</td>

        :`<div class="empty">Nothing logged.</div>`}</section>

      .map(([n,h])=>`<tr><td class="n" style="width:56px"><b>${esc(n)}</b></td><td>${esc(emp(n).name)}</td>

      :`<div class="empty">Nothing logged.</div>`}</section>`;

  $('#d-job').addEventListener('change',e=>{F.jobNo=e.target.value;dash();});
  $('#d-f').addEventListener('change',e=>{F.from=e.target.value;dash();});

    const out=[['Date','Job #','Job','Foreman','Emp #','Employee','Cost code','Description','Hours']];

    csv('daily-summary.csv',out);
  });
}

function openSheet(id){
  const s=SHEETS.find(x=>x.id===id); if(!s) return;
  const j=job(s.jobNo), codes=s.codes||[];
  const crew=Object.entries(s.hours||{}).filter(([,r])=>Object.values(r).some(v=>num(v)));
  $('#dlg-t').textContent=`${s.jobNo} — ${fmtDate(s.date)}`;
  $('#dlg-b').innerHTML=`
    <p style="margin:0 0 12px" class="muted">${esc(j.name)} · ${esc(s.foreman)}${s.weather?' · '+esc(s.weather):''}</p>
    <div class="scroll"><table class="mx"><thead><tr><th class="stick"><div class="who"><span class="lbl">Employee</span></div></th>
      ${codes.map(c=>`<th>${esc(c)}</th>`).join('')}<th class="tot">Total</th></tr></thead><tbody>
      ${crew.map(([en,row])=>`<tr><td class="stick"><div class="who"><b>${esc(en)}</b><span>${esc(emp(en).name)}</span></div></td>
        ${codes.map(c=>`<td style="padding:9px">${row[c]?esc(row[c]):''}</td>`).join('')}
        <td class="tot">${r2(codes.reduce((a,c)=>a+num(row[c]),0))}</td></tr>`).join('')}</tbody></table></div>
    ${(s.equipment||[]).length?`<h3 class="lbl" style="margin:16px 0 7px">Equipment</h3><div class="chips">
      ${s.equipment.map(e=>`<span class="chip flat">${esc(e.name)} · ${esc(e.hours||0)} hr</span>`).join('')}</div>`:''}
    ${(s.quantities||[]).length?`<h3 class="lbl" style="margin:16px 0 7px">Quantities</h3><div class="chips">
      ${s.quantities.map(q=>`<span class="chip flat">${esc(q.code)} · ${esc(q.qty)} ${esc(codeInfo(q.code).unit)}</span>`).join('')}</div>`:''}
    ${s.activities?`<h3 class="lbl" style="margin:16px 0 6px">Daily activities</h3><p style="margin:0;white-space:pre-wrap">${esc(s.activities)}</p>`:''}
    ${s.safety?`<h3 class="lbl" style="margin:16px 0 6px">Safety discussion</h3><p style="margin:0">${esc(s.safety)}</p>`:''}
    <div style="margin-top:18px;display:flex;gap:9px;flex-wrap:wrap">
      <button class="btn ghost" id="dup">Copy into today's form</button>
      ${isOffice()?`<button class="btn danger" id="del">Delete sheet</button>`:''}
    </div>`;
  $('#dlg').showModal();
  $('#dup').addEventListener('click', async ()=>{
    DRAFT=structuredClone(s); DRAFT.id=''; DRAFT.submittedAt=''; DRAFT.date=today();
    await put(K.draft,DRAFT); $('#dlg').close(); TAB='entry'; render();
  });
  if($('#del')) $('#del').addEventListener('click', async ()=>{
    if(!confirm('Delete this sheet?')) return;
    SHEETS=SHEETS.filter(x=>x.id!==id); await put(K.sheets,SHEETS); $('#dlg').close(); dash();
  });
}

function csv(name,rows){
  const cell=v=>{v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const b=new Blob([rows.map(r=>r.map(cell).join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
}

   ========================================================================== */

  const activeEmp = CFG.employees.filter(e=>e.active);
  const byCrew = {};
  CFG.crews.forEach(c=>byCrew[c.key]=activeEmp.filter(e=>e.crew===c.key));
  const orphan = activeEmp.filter(e=>!CFG.crews.some(c=>c.key===e.crew));

  $('#view').innerHTML=`
  <section class="card">
    <div class="head"><h2>Data hub connection</h2></div>
    <div class="body">
      <label class="f"><span class="lbl">Apps Script web app URL</span>
        <input id="s-ep" value="${esc(EP)}" placeholder="https://script.google.com/macros/s/…/exec"></label>
      <p class="muted" style="font-size:13px;margin:9px 0 0">
        Jobs, cost codes, employees, and equipment are read from the hub — edit them there, not here.
        ${QUEUE.length?`<b>${QUEUE.length} sheet(s) waiting to send.</b>`:''}</p>
      <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:11px">
        <button class="mini" id="s-sync">Refresh from hub</button>
        ${QUEUE.length?`<button class="mini" id="s-flush">Try sending now</button>`:''}
        <button class="mini" id="s-demo">Load sample week</button>
        <button class="mini x" id="s-wipe">Clear all sheets</button>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="head"><h2>Crews</h2><span class="right muted" style="font-size:12px">${activeEmp.length} active</span></div>
    <div class="body">
      ${CFG.crews.map(c=>`<h3 class="lbl" style="margin:0 0 8px">${esc(c.name)} — ${byCrew[c.key].length}</h3>
        <div class="chips" style="margin-bottom:16px">${byCrew[c.key].map(e=>
          `<span class="chip flat"><b>${esc(e.n)}</b> ${esc(e.name)}</span>`).join('') || '<span class="muted">Nobody assigned.</span>'}</div>`).join('')}
      ${orphan.length?`<h3 class="lbl" style="margin:0 0 8px">Not on a field crew</h3><div class="chips">
        ${orphan.map(e=>`<span class="chip flat"><b>${esc(e.n)}</b> ${esc(e.name)} <small>${esc(e.crew||'—')}</small></span>`).join('')}</div>`:''}
    </div>
  </section>

  <section class="card">
    <div class="head"><h2>Active jobs</h2></div>
    <table class="list"><thead><tr><th style="width:80px">Job #</th><th>Name</th><th class="n" style="width:110px">Cost codes</th></tr></thead>
      <tbody>${activeJobs().map(j=>`<tr><td class="n"><b>${esc(j.no)}</b></td><td>${esc(j.name)}</td>
        <td class="n" style="${j.codes.length?'':'color:var(--alert)'}">${j.codes.length||'none set'}</td></tr>`).join('')}</tbody></table>
  </section>

  <section class="card">
    <div class="head"><h2>Paid holiday eligibility</h2><span class="right muted" style="font-size:12px">180 days from hire</span></div>
    <div class="body"><p class="muted" style="margin:0;font-size:14px">
      Add a Date Hired column to what the hub returns and this will list who crosses 180 days in the next 30.</p></div>
  </section>

  <section class="card">
    <div class="head"><h2>Data</h2></div>
    <div class="body">
      <p class="muted" style="margin:0 0 12px">${SHEETS.length} sheet${SHEETS.length===1?'':'s'} stored.
        Saving to: <b>${esc(BACKEND)}</b>.</p>
      <div style="display:flex;gap:9px;flex-wrap:wrap">
        <button class="btn ghost" id="d-out">Download backup</button>
        <button class="btn ghost" id="d-pin">Change office PIN</button>
      </div>
    </div>
  </section>`;

  $('#s-ep').addEventListener('change', async e=>{ EP=e.target.value.trim(); await put(K.ep,EP); await syncConfig(); flushQueue(); setup(); });
  $('#s-sync').addEventListener('click', async ()=>{ await syncConfig(); setup(); });
  if($('#s-flush')) $('#s-flush').addEventListener('click', flushQueue);
  $('#s-demo').addEventListener('click', loadDemo);
  $('#s-wipe').addEventListener('click', async ()=>{
    if(!confirm('Remove every sheet stored on this device? The Google Sheet is not touched.')) return;
    SHEETS=[]; await put(K.sheets,SHEETS); setup();
  });
  $('#d-pin').addEventListener('click', async ()=>{
    const p=prompt('New office PIN',CFG.pin); if(!p) return;
    CFG.pin=p.trim(); await put(K.cfg,CFG); alert('PIN updated.');
  });
  $('#d-out').addEventListener('click',()=>{
    const b=new Blob([JSON.stringify({config:CFG,sheets:SHEETS},null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(b);
    a.download='daily-sheets-backup.json'; document.body.appendChild(a); a.click(); a.remove();
  });
}
